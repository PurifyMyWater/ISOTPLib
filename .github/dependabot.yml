version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    assignees:
      - "vacmg"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    cooldown:
      default-days: 90
    rebase-strategy: "disabled"
    groups:
      github-actions:
        patterns:
          - "*"
